<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>CONTACT | Miho Takahashi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header id="header">
  <h1 class="logo">
    <a href="index.html"><img src="tlogo.svg" alt="Beauty"></a>
  </h1>
  <nav class="nav">
    <ul class="nav-list">
      <li><a href="index.html">HOME</a></li>
      <li><a href="index.html#service">SERVICE</a></li>
      <li><a href="index.html#portfolio">PORTFOLIO</a></li>
      <li><a href="contact.html">CONTACT</a></li>
    </ul>
  </nav>
</header>

<main>
  <div class="page-header-simple wrapper" style="padding: 140px 0 40px; text-align: center;">
    <h1 style="font-family: 'YuMincho', serif; font-size: 32px; font-weight: normal;">CONTACT</h1>
    <p style="font-size: 14px; color: #888; margin-top: 10px;">お仕事のご依頼・ご相談は、以下のフォームよりお気軽にご連絡ください。</p>
  </div> <section class="contact-form">
    <form action="#" method="post">
      <div class="form-item">
        <label for="name">お名前</label>
        <input type="text" id="name" name="your-name" required>
      </div>
      <div class="form-item">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="your-email" required>
      </div>
      <div class="form-item">
        <label for="message">メッセージ</label>
        <textarea id="message" name="your-message" required></textarea>
      </div>
      <button type="submit" class="submit-btn">SEND MESSAGE</button>
    </form>
  </section>
</main>

<footer id="footer">
  <div class="inner wrapper">
    <div class="logo"><img src="tlogo.svg" alt="Beauty"></div>
    <p class="copyright">©2024 Beauty.</p>
  </div>
</footer>

</body>
</html>
