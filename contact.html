<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>CONTACT | Miho Takahashi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">

</head>
<body>

<header id="header">
  <h1 class="logo">
    <a href="index.html"><img src="tlogo.svg" alt="Beauty"></a>
  </h1>
  <nav class="nav">
    <ul class="nav-list">
      <li><a href="index.html">HOME</a></li>
      <li><a href="index.html#service">SERVICE</a></li>
      <li><a href="index.html#portfolio">PORTFOLIO</a></li>
      <li><a href="contact.html">CONTACT</a></li>
    </ul>
  </nav>
</header>

<main>
  <div class="page-header-simple wrapper" style="padding: 120px 0 20px; text-align: center;">
    <h1 style="font-family: 'YuMincho', serif; font-size: 28px; font-weight: normal;">CONTACT</h1>
    <p style="font-size: 13px; color: #888; margin-top: 10px;">お仕事のご依頼・ご相談は、以下よりご連絡ください。</p>
  </div> 

  <form action="https://ssgform.com/s/sszfMT0eix9g" method="post">
  
  <div class="form-item">
    <label for="name">お名前</label>
    <input type="text" id="name" name="お名前" required>
  </div>
  
  <div class="form-item">
    <label for="email">メールアドレス</label>
    <input type="email" id="email" name="メールアドレス" required>
  </div>
  
  <div class="form-item">
    <label for="message">メッセージ</label>
    <textarea id="message" name="お問い合わせ内容" class="expand-textarea" required></textarea>
  </div>

  <button type="submit" class="submit-btn">SEND MESSAGE</button>
</form>
</main>

<footer id="footer">
  <div class="inner wrapper">
    <div class="logo"><img src="tlogo.svg" alt="Beauty"></div>
    <p class="copyright">©2024 Beauty.</p>
  </div>
</footer>

</body>
